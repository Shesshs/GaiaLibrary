<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/favourites.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
</head>
<body>
    
    <div class="upper">
        <a href="index.html" style="text-decoration: none;"><div class="logo" style="font-size: 32px; font-weight: 600;">
                <span style="color:lime">Gaia</span>
                <span style="color:rgb(129, 0, 146)">Library</span>
            </div>
        </a>
        <div class="utils">
            <a href="bookmarks.html">
                <button class="bookmarks current-util">
                    <i class="fa-regular fa-bookmark"></i>
                </button>
            </a>
            <a href="favourites.html">
                <button class="favourites">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </a>
            <a href="recently.html">
                <button class="history">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
            </a>
            
        </div>
    </div>
    
    <main>
        <div class="prev nav">
            <div class="navi naviPrev" data-name="Previous">
                <i class="fa-solid fa-arrow-down"></i>
            </div>
        </div>
        <div class="shelf">
            <h4 class="shelf-count">Shelf 1</h4>
            <div class="bookshelf">
                <div class="popular"></div>
            </div>
        </div>
        
        <div class="next nav">
            <div class="navi naviNext" data-name="Next">
                <i class="fa-solid fa-arrow-up"></i>
            </div>
        </div>
    </main>
    <div class="shelf-nav">
        <form id="form-shelf">
        <input class="shelf-page-search shelf-nav-util" value="" placeholder="Page...">
        </form>
    </div>
    <script src="scripts/bookmarks.js"></script>
    
</body>
</html>
